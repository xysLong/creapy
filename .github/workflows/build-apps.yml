# Builds the double-click apps on every version tag (v0.2.1 ...) or by hand (Actions > Run workflow).
# Artifacts: creapy.io-<version>-macOS.zip (Apple silicon), -macOS-intel.zip, -Windows.zip, attached to a release.
name: Build desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # Apple silicon
            script: bash packaging/build.sh
          - os: macos-13      # Intel
            script: bash packaging/build.sh
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pyinstaller
      - name: Build and self-test
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: creapy.io-${{ matrix.os }}
          path: dist/creapy.io-*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
